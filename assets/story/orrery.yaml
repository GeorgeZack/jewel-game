# The Orrery: the upgrade grid, bought with residue. See docs/story.md.
# Four regions of fifteen nodes on four rings (4 is the outermost). Costs are placeholders.
# A node without a name shows its rite name. Large nodes carry a perk: a rule for the hero's duels.
# Neighbouring regions join on the outer and the inner ring.
# Aether is a fifth region of twelve on ring 0, the core: it has no seat, each region's ring 1
# links into it, and it stays locked until the story sets aether_unlocked.

