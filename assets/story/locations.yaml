# The map. Act 1 is the city of Aldermoor and the undercroft below it (the first six places);
# everything from Highwatch on is placeholder for Acts 2 and 3, kept from the Hollow King slice.
# Ids are kept from the slice so saves still load: emberfield is Saltpetre Row, and so on.
- id: emberfield
  name: Saltpetre Row
  residue: fire
  town: true
  open: true
  x: 0.1
  y: 0.78
  level: 1
  desc: Lodging houses, a boxing club and a chemist's, all leaning on each other. Your rooms.
  people:
    - name: Mrs Bessa
      scene: bessa_talk
    - name: Sergeant Holm
      scene: spar_talk
  roads: [mossgate]
- id: mossgate
  name: The Undercroft Stair
  residue: earth
  open: true
  x: 0.24
  y: 0.62
  level: 1
  desc: Steps under the Row, down to cellars older than the city. Lights where no lamps are.
  roads: [emberfield, stonebridge, greyfen]
  foes: [rat, goblin, slime]
- id: stonebridge
  name: The Exchange
  residue: water
  town: true
  x: 0.38
  y: 0.74
  level: 2
  desc: A columned hall where every society in Aldermoor keeps a room, and an eye on the others.
  enter_scene: stonebridge_arrival
  people:
    - name: Dr Tallis
      scene: tallis_talk
    - name: Silas Merrow
      scene: merrow_talk
    - name: Miss Marlow
      scene: marlow_talk
  roads: [mossgate, barrow, redtusk]
- id: greyfen
  name: The Fleet Culvert
  residue: water
  x: 0.2
  y: 0.36
  level: 3
  desc: A buried river under brick vaults. Things come down it from the old graves.
  roads: [mossgate, barrow]
  foes: [slime, spider, bandit]
- id: barrow
  name: St Ebba's Necropolis
  residue: earth
  x: 0.38
  y: 0.44
  level: 5
  desc: Catacombs under a closed cemetery. The dead here have stopped staying down.
  roads: [greyfen, stonebridge, institute, highwatch]
  foes: [skeleton, ghoul, spider]
- id: institute
  name: The Halloran Institute
  residue: air
  x: 0.34
  y: 0.27
  level: 5
  desc: A shut college of the sciences, its doors chained since the fire. Something keeps house.
  roads: [barrow]
  foes: [skeleton, ghoul]
- id: highwatch
  name: Highwatch
  residue: air
  town: true
  x: 0.56
  y: 0.32
  level: 6
  desc: "Placeholder for Act 2: the last garrison between the city and the mountains."
  people:
    - name: Captain Ise
      scene: ise_talk
      requires: [quest:barrow_lord]
  roads: [barrow, ironpeak, redtusk]
- id: redtusk
  name: Redcap Camp
  residue: fire
  x: 0.56
  y: 0.68
  level: 7
  desc: Tents, drums, and a great many spears.
  roads: [stonebridge, highwatch, silverlake]
  foes: [orc, wolf, bandit]
- id: ironpeak
  name: Ironpeak Pass
  residue: air
  x: 0.72
  y: 0.16
  level: 9
  desc: The wind here cuts deeper than the cold.
  roads: [highwatch, sunken]
  foes: [troll, wolf, wyvern]
- id: silverlake
  name: Silverlake
  residue: water
  town: true
  x: 0.74
  y: 0.8
  level: 8
  desc: A city of scholars on a lake that never freezes.
  roads: [redtusk, sunken]
- id: sunken
  name: The Sunken Temple
  residue: earth
  x: 0.82
  y: 0.5
  level: 11
  desc: Its bells still ring, deep under the water.
  roads: [ironpeak, silverlake, ashen]
  foes: [wraith, cultist, ghoul]
- id: ashen
  name: The Ashen Waste
  residue: fire
  x: 0.7
  y: 0.4
  level: 13
  desc: Burned flat, long ago, by something that is still here.
  roads: [sunken, hollow]
  foes: [wyvern, cultist, troll]
- id: hollow
  name: Hollow Keep
  residue: air
  x: 0.9
  y: 0.16
  level: 15
  desc: 'The throne room faces the wrong way: inward.'
  roads: [ashen]
  foes: [wraith, cultist]
