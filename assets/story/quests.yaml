# Quests. The main quests are listed in the order they are meant to be played (the tests play
# them in this order). Act 1 runs from goblins to founding; from warchief on is placeholder for
# Acts 2 and 3, kept from the Hollow King slice. Ids are kept from the slice so saves still load.

# Act 1: Aldermoor. Every society courts the adept: the Royal Society (toll), the Independents
# (ledger) and the College (reading). The founding quest sets the first lean and opens the academy.
- id: goblins
  title: Lights Below
  main: true
  giver: emberfield
  at: mossgate
  foe: goblin
  level: 1
  count: 2
  gold: 40
  xp: 50
  opens: [stonebridge, greyfen]
  offer_scene: goblins_offer
  done_scene: goblins_done
  intro: Bogles have come up the Undercroft Stair into the Row's cellars. Drive two of them back down.
  outro: The bogles weren't raiding. They were running, from something deeper.
- id: toll
  title: A Fellow's Errand
  main: true
  giver: stonebridge
  requires: [quest:goblins]
  at: greyfen
  foe: bandit
  level: 2
  count: 2
  gold: 70
  xp: 80
  opens: [barrow]
  done_scene: toll_done
  intro: Dr Tallis of the Royal Society wants the resurrection men out of the Fleet Culvert. They are selling his anatomists the wrong dead.
  outro: The last resurrection man names his buyer before he runs. It is not the Royal Society.
- id: ledger
  title: Merrow's Ledger
  main: true
  giver: stonebridge
  requires: [quest:goblins]
  at: greyfen
  foe: spider
  level: 3
  count: 2
  gold: 90
  xp: 110
  done_scene: ledger_done
  intro: Silas Merrow of the Independents wants a ledger the Royal Society took from him. Its strongroom is on the Culvert, behind the shroud spinners' nests.
  outro: The nests are cleared, and the strongroom door is in front of you.
- id: reading
  title: The Sealed Reading
  main: true
  giver: stonebridge
  requires: [quest:toll]
  at: barrow
  foe: skeleton
  level: 4
  count: 2
  gold: 120
  xp: 150
  done_scene: reading_done
  intro: Miss Marlow of the College needs a reliquary in St Ebba's catacombs read before anyone else finds it. Ossuary sentinels stand in the way.
  outro: The sentinels fall apart. The reliquary waits behind them, still sealed.
- id: barrow_lord
  title: What Walks the Necropolis
  main: true
  giver: stonebridge
  requires: [quest:toll, quest:ledger, quest:reading]
  at: barrow
  foe: barrow_lord
  level: 5
  count: 1
  gold: 160
  xp: 200
  item: barrow_mail
  opens: [institute]
  done_scene: barrow_done
  intro: Every society agrees on one thing. Whatever walks the Necropolis has a crown, and it is waking the dead below the city. Put it back.
  outro: Before it crumbles, the Lord points north. 'He is hollow, and he is coming. We only went ahead.' Its mail is still good.
- id: founding
  title: The Founding
  main: true
  giver: stonebridge
  requires: [quest:barrow_lord]
  at: institute
  foe: ghoul
  level: 5
  count: 2
  gold: 200
  xp: 250
  opens: [highwatch, redtusk]
  offer_scene: founding_offer
  done_scene: founding_done
  intro: The Halloran Institute stands empty, and whoever clears it can claim it. Drive out the ghouls that keep house there.
  outro: The last ghoul goes into the furnace. The Institute is quiet, and the keys are yours.

# Acts 2 and 3: placeholder, kept from the Hollow King slice until those acts are written.
- id: warchief
  title: Spears at Highwatch
  main: true
  giver: highwatch
  requires: [quest:founding]
  at: redtusk
  foe: warchief
  level: 8
  count: 1
  gold: 300
  xp: 350
  opens: [silverlake, ironpeak]
  intro: The redcap host masses on the road, driven from its hills. Captain Ise will hold the wall if you break their Chieftain.
  outro: The Chieftain laughs through his blood. 'We were not attacking. We were leaving. You should too.'
- id: archive
  done_scene: archive_done
  title: The Lake Archive
  main: true
  giver: silverlake
  requires: [quest:warchief]
  at: ironpeak
  foe: troll
  level: 9
  count: 2
  gold: 420
  xp: 500
  item: heart_stone
  opens: [sunken]
  intro: The archivists of Silverlake know the Hollow King's story but their copies are held by the pass-monks of Ironpeak, and Fomorians have taken the road. Clear it.
  outro: A king traded his heart to outlast death, and it worked. His heart still beats, hidden in the Sunken Temple.
- id: priest
  title: The Drowned Choir
  main: true
  giver: silverlake
  requires: [quest:archive]
  at: sunken
  foe: high_priest
  level: 12
  count: 1
  gold: 650
  xp: 800
  opens: [ashen]
  intro: The Drowned Priest guards the King's heart below the water. End the choir and cut the bell-rope.
  outro: The bells stop. Far away, across the Waste, something turns to look at you.
- id: wyrm
  title: Ash and Ember
  main: true
  giver: highwatch
  requires: [quest:priest]
  at: ashen
  foe: ember_wyrm
  level: 14
  count: 1
  gold: 900
  xp: 1100
  item: kingsbane
  opens: [hollow]
  intro: Only one road crosses the Waste, and the Ember Wyrm has slept across it since it burned the land. Wake it. Kill it.
  outro: 'The way to Hollow Keep lies open. A forge-master pulls a blade from the Wyrm''s hide, and it fits your hand: Kingsbane.'
- id: king
  done_scene: king_done
  title: The Hollow King
  main: true
  giver: highwatch
  requires: [quest:wyrm]
  at: hollow
  foe: hollow_king
  level: 16
  count: 1
  gold: 2000
  xp: 2500
  intro: Everything has been walking toward this room. Go and finish it.
  outro: The King's crown rolls across the floor and stops. Outside, for the first time in a generation, it rains on the Waste. You did it, and Aldermoor will never believe it.
- id: rats
  title: Cellar Trouble
  giver: emberfield
  at: mossgate
  foe: rat
  level: 1
  count: 2
  gold: 35
  xp: 40
  intro: Corpse-candles are drifting up the Stair into the Row's cellars, and nobody will go down for coal. A few coins if you snuff them out.
  outro: The cellars are dark again, and the landlady is almost grateful.
- id: spiders
  title: Web Silk
  giver: stonebridge
  requires: [quest:goblins]
  at: greyfen
  foe: spider
  level: 3
  count: 3
  gold: 120
  xp: 120
  intro: The weavers will pay well for shroud spinner silk, as long as you're the one fetching it.
  outro: You smell terrible but you are rich.
- id: wolves
  title: Black Dogs at the Wall
  giver: highwatch
  requires: [quest:barrow_lord]
  at: redtusk
  foe: wolf
  level: 7
  count: 3
  gold: 260
  xp: 300
  intro: The barghests have followed the redcaps down. They're taking sentries off the wall.
  outro: The sentries sleep a little better. The captain buys you a drink, and only one.
- id: wyverns
  title: Eggs of Ironpeak
  giver: silverlake
  requires: [quest:warchief]
  at: ironpeak
  foe: wyvern
  level: 10
  count: 2
  gold: 480
  xp: 520
  intro: A naturalist wants the salamander nests studied. The parents disagree.
  outro: The naturalist is thrilled and pays double for the scars.
- id: cult
  title: Those Who Kneel
  giver: silverlake
  requires: [quest:archive]
  at: sunken
  foe: cultist
  level: 11
  count: 3
  gold: 560
  xp: 620
  intro: Some of the missing scholars weren't taken. They went. Find them in the temple.
  outro: They wouldn't come back. You took their notes instead.
