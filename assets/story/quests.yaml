# Quests. The main quests are listed in the order they are meant to be played (the tests play
# them in this order). Act 1 runs from goblins to founding; Acts 2 and 3 run from
# warchief to king, down through the deep undercroft to the Engine. Ids are kept from the slice so saves still load.

# Act 1: Aldermoor. Every society courts the adept: the Royal Society (toll), the Independents
# (ledger) and the College (reading). The founding quest sets the first lean and opens the academy.
- id: goblins
  title: Lights Below
  main: true
  giver: emberfield
  at: mossgate
  foe: goblin
  level: 1
  count: 2
  gold: 40
  xp: 50
  opens: [stonebridge, greyfen]
  offer_scene: goblins_offer
  done_scene: goblins_done
  intro: Bogles have come up the Undercroft Stair into the Row's cellars. Drive two of them back down.
  outro: The bogles weren't raiding. They were running, from something deeper.
- id: toll
  title: A Fellow's Errand
  main: true
  giver: stonebridge
  requires: [quest:goblins]
  at: greyfen
  foe: bandit
  level: 2
  count: 2
  gold: 70
  xp: 80
  opens: [barrow]
  done_scene: toll_done
  intro: Dr Tallis of the Royal Society wants the resurrection men out of the Fleet Culvert. They are selling his anatomists the wrong dead.
  outro: The last resurrection man names his buyer before he runs. It is not the Royal Society.
- id: ledger
  title: Merrow's Ledger
  main: true
  giver: stonebridge
  requires: [quest:goblins]
  at: greyfen
  foe: spider
  level: 3
  count: 2
  gold: 90
  xp: 110
  done_scene: ledger_done
  intro: Silas Merrow of the Independents wants a ledger the Royal Society took from him. Its strongroom is on the Culvert, behind the shroud spinners' nests.
  outro: The nests are cleared, and the strongroom door is in front of you.
- id: reading
  title: The Sealed Reading
  main: true
  giver: stonebridge
  requires: [quest:toll]
  at: barrow
  foe: skeleton
  level: 4
  count: 2
  gold: 120
  xp: 150
  done_scene: reading_done
  intro: Miss Marlow of the College needs a reliquary in St Ebba's catacombs read before anyone else finds it. Ossuary sentinels stand in the way.
  outro: The sentinels fall apart. The reliquary waits behind them, still sealed.
- id: barrow_lord
  title: What Walks the Necropolis
  main: true
  giver: stonebridge
  requires: [quest:toll, quest:ledger, quest:reading]
  at: barrow
  foe: barrow_lord
  level: 5
  count: 1
  gold: 160
  xp: 200
  item: barrow_mail
  opens: [institute]
  done_scene: barrow_done
  intro: Every society agrees on one thing. Whatever walks the Necropolis has a crown, and it is not what woke the dead below the city. Put it back anyway.
  outro: Before it crumbles, the Lord points north. 'He is hollow, and his Engine calls us. We only rose first.' Its mail is still good.
- id: founding
  title: The Founding
  main: true
  giver: stonebridge
  requires: [quest:barrow_lord]
  at: institute
  foe: ghoul
  level: 5
  count: 2
  gold: 200
  xp: 250
  opens: [highwatch, redtusk]
  offer_scene: founding_offer
  done_scene: founding_done
  intro: The Halloran Institute stands empty, and whoever clears it can claim it. Drive out the ghouls that keep house there.
  outro: The last ghoul goes into the furnace. The Institute is quiet, and the keys are yours.

# Acts 2 and 3: the deep undercroft. Whose Engine is waking the dead, and what it runs on.
- id: warchief
  title: The Red Court
  main: true
  giver: highwatch
  requires: [quest:founding]
  at: redtusk
  foe: warchief
  level: 8
  count: 1
  gold: 300
  xp: 350
  opens: [silverlake, ironpeak]
  intro: The stair in your cellar ends at the Shambles, and the redcaps have come up into it in hundreds. Inspector Ise will hold the gate if you break their Chieftain.
  outro: The Chieftain laughs through his blood. 'We were not attacking. We were leaving. You should too.'
- id: archive
  done_scene: archive_done
  title: The Halloran Papers
  main: true
  giver: silverlake
  requires: [quest:warchief]
  at: ironpeak
  foe: troll
  level: 9
  count: 2
  gold: 420
  xp: 500
  item: heart_stone
  opens: [sunken]
  intro: Your teacher sent his papers to the Athenaeum by pneumatic post the night he died. They never arrived. They are still in the tubes of the Atmospheric Line, and Fomorians nest there.
  outro: Halloran built an Engine to outlast death, and gave it his heart to run on. It worked. The heart still beats, kept in the Drowned Chapel.
- id: priest
  title: The Drowned Choir
  main: true
  giver: silverlake
  requires: [quest:archive]
  at: sunken
  foe: high_priest
  level: 12
  count: 1
  gold: 650
  xp: 800
  opens: [ashen]
  intro: The Institute's second founder went down with the chapel, and keeps Halloran's heart below the water. End his choir and cut the bell-rope.
  outro: The bells stop. The heart is not here. Far below, past the gasworks, something turns to look at you.
- id: wyrm
  title: Ash and Ember
  main: true
  giver: highwatch
  requires: [quest:priest]
  at: ashen
  foe: ember_wyrm
  level: 14
  count: 1
  gold: 900
  xp: 1100
  item: kingsbane
  opens: [hollow]
  intro: One way leads down through the Retort House, and the Athanor has slept across it since it burned the works out. Wake it. Put it out.
  outro: 'The way to the Engine House lies open. In the Athanor''s clinker is a blade of cold iron, and it fits your hand: Heartseeker.'
- id: king
  done_scene: king_done
  title: The Hollow Man
  main: true
  giver: highwatch
  requires: [quest:wyrm]
  at: hollow
  foe: hollow_king
  level: 16
  count: 1
  gold: 2000
  xp: 2500
  intro: Everything dead in Aldermoor has been walking toward this room. The man who wrote your letter is in it. Go and finish it.
  outro: The Engine stops, and your teacher with it. Above, every lamp in the city gutters once and steadies. You did it, and Aldermoor will never believe it.
- id: rats
  title: Cellar Trouble
  giver: emberfield
  at: mossgate
  foe: rat
  level: 1
  count: 2
  gold: 35
  xp: 40
  intro: Corpse-candles are drifting up the Stair into the Row's cellars, and nobody will go down for coal. A few coins if you snuff them out.
  outro: The cellars are dark again, and the landlady is almost grateful.
- id: spiders
  title: Web Silk
  giver: stonebridge
  requires: [quest:goblins]
  at: greyfen
  foe: spider
  level: 3
  count: 3
  gold: 120
  xp: 120
  intro: The weavers will pay well for shroud spinner silk, as long as you're the one fetching it.
  outro: You smell terrible but you are rich.
- id: wolves
  title: Black Dogs at the Gate
  giver: highwatch
  requires: [quest:barrow_lord]
  at: redtusk
  foe: wolf
  level: 7
  count: 3
  gold: 260
  xp: 300
  intro: The barghests have followed the redcaps down. They're taking constables off the gate.
  outro: The Watch sleeps a little better. The inspector buys you a drink, and only one.
- id: wyverns
  title: Nests on the Line
  giver: silverlake
  requires: [quest:warchief]
  at: ironpeak
  foe: wyvern
  level: 10
  count: 2
  gold: 480
  xp: 520
  intro: A naturalist wants the salamander nests studied. The parents disagree.
  outro: The naturalist is thrilled and pays double for the scars.
- id: cult
  title: Those Who Kneel
  giver: silverlake
  requires: [quest:archive]
  at: sunken
  foe: cultist
  level: 11
  count: 3
  gold: 560
  xp: 620
  intro: Some of the Athenaeum's missing readers weren't taken. They went. Find them in the chapel.
  outro: They wouldn't come back. You took their notes instead.
