# Rule cards: a different board, or different payouts, for a duel. See docs/story.md.
# A foe names its card in foes.yaml; try any card in a dev build with JEWEL_CARD=<id> ./start.sh.
# Every number is a placeholder.

- id: standard
  name: Common duel
  desc: The usual board, with reagents settling downward.

- id: sideways
  name: Sideways
  gravity: left
  desc: Reagents fall to the left, and new ones arrive from the right.

- id: great_hall
  name: Lecture Theatre
  width: 10
  height: 10
  desc: The largest board, ten by ten.

# Boss cards: each changes one rule. Early bosses get the gentler ones.

- id: barrow_hush
  name: Grave Hush
  skull_pct: -25
  mana_pct: 50
  desc: Skulls hit a quarter softer and reagent matches pay half again, so rites carry this duel.

- id: war_drums
  name: Black Powder
  overcharge: true
  desc: Overcharged board, so a +5 skull blasts a five by five square.

- id: updraft
  name: Levitation
  gravity: up
  desc: Reagents fall upward, and new ones arrive from below.

- id: hollow_halls
  name: Long Gallery
  width: 10
  height: 8
  desc: A wide ten by eight board, where moves are plenty and cascades run long.
