    name: Knight
    desc: Holy armor and steady damage. Forgiving, and hard to kill.
  warrior:
    name: Warrior
    desc: Rage and big skull hits. Wins by ending fights early.
  druid:
    name: Druid
    desc: Poison, healing and control of the Earth and the board.
  wizard:
    name: Wizard
    desc: Fragile, with the deepest mana and the strongest spells.

