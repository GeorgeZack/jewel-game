# Every line the game draws, except the story itself.
# The story (names, dialogue, quests) lives in assets/story/, or in
# assets/lang/<language>/story/ when that folder has a story.yaml.
# Change a value and save: the desktop game picks it up immediately.
# A translation may leave keys out; the English in this file is not required
# at runtime, the game keeps the original English for any missing key.
# Patterns use Go formatting: %s text, %d number, %[2]s to swap argument order.

